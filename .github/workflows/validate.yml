name: validate-rules

# Backstop for the pre-commit hook: if someone commits with --no-verify or without the
# hook enabled, CI still fails on stale generated output or broken workflow wiring.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated outputs are fresh
        shell: powershell
        run: .\agents\scripts\sync-rules.ps1 -Check
      - name: Workflow wiring audit
        shell: powershell
        run: .\scripts\validate-workflows.ps1
